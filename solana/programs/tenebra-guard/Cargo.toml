[package]
name = "tenebra-guard"
description = "On-chain swap guard, staking and real-yield revenue distribution for the Tenebra router."
version = "0.1.0"
edition = "2021"
# Solana CLI ≥ 2.2 builds programs with rustc 1.84 (platform-tools v1.45+).
rust-version = "1.84"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "tenebra_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022"] }
tenebra-tokenomics = { path = "../../../crates/tenebra-tokenomics" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
