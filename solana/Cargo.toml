# Separate workspace: Solana/Anchor dependencies stay out of the core
# workspace's build, and the program can track Solana's toolchain.
[workspace]
resolver = "2"
members = ["programs/tenebra-guard"]
exclude = ["harness"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
