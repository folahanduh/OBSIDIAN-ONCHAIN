[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenebra-bt"
version = "0.1.0"
description = "Tenebra backtester: integer-exact mirror of the on-chain quant engine."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["tenebra_bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
